
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Business Empire Simulator V0.9.55</title>

  <link rel="stylesheet" href="style.css?v=0.9.55">
</head>

<body>

  <div id="game"></div>
  <button id="fullscreenLandscape" type="button" aria-label="Activer le plein écran paysage">⛶ Plein écran</button>
  <div id="rotateOverlay">
    <div class="rotateContent">
      <div class="rotateIcon">↻</div>
      <strong>Tourne ton téléphone</strong>
      <p>Business Empire Simulator se joue désormais en paysage.</p>
      <button id="startLandscape" type="button">Passer en plein écran</button>
    </div>
  </div>

  <div id="hud">
    <h1>BUSINESS EMPIRE</h1>
    <span>SUPERMARKET SIMULATOR</span>

    <div class="stats">
      <div>Argent : <b id="money">5 000 €</b></div>
      <div>Jour : <b id="day">1</b></div>
      <div>Heure : <b id="hour">08:00</b></div>
      <div>Magasin : <b id="shopStatus">FERMÉ</b></div>
      <div>Stock : <b id="stock">30</b></div>
    </div>
  </div>

  <div id="crosshair">+</div>

  <div id="actions">
    <button id="restock">Réapprovisionner</button>
    <button id="openShop">Ouvrir le magasin</button>
  </div>

  <div id="controls">
    <div id="joystick" aria-label="Joystick de déplacement"><div id="joystickStick"></div></div>
    <div class="hint">Glisse sur l'écran pour regarder</div>
  </div>

  <div id="message"></div>

  <script>
    async function requestLandscape(){
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen)
          await document.documentElement.requestFullscreen();
        if (screen.orientation && screen.orientation.lock)
          await screen.orientation.lock("landscape");
      } catch(e) {
        // Le navigateur peut refuser le verrouillage : rotation manuelle possible.
      }
    }
    document.getElementById("startLandscape").addEventListener("click",requestLandscape);
    document.getElementById("fullscreenLandscape").addEventListener("click",requestLandscape);
  </script>
  <script type="module" src="game.js?v=0.9.55"></script>

</body>
</html>
